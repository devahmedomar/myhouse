<div class="page form-page">
  <div class="page-header">
    <h1>{{ id ? labels.editTransaction : labels.newTransaction }}</h1>
    <a routerLink="/transactions" class="btn btn-secondary btn-small">{{ labels.cancel }}</a>
  </div>

  <app-loading *ngIf="loading"></app-loading>

  <div class="card" *ngIf="!loading">
    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="field">
        <label>{{ labels.type }}</label>
        <div class="radio-row">
          <label class="radio-label">
            <input type="radio" formControlName="type" value="expense" (change)="onTypeChange()" />
            {{ labels.expense }}
          </label>
          <label class="radio-label">
            <input type="radio" formControlName="type" value="income" (change)="onTypeChange()" />
            {{ labels.income }}
          </label>
        </div>
      </div>

      <div class="field">
        <label for="amount">{{ labels.amount }}</label>
        <input id="amount" type="number" step="0.01" min="0.01" formControlName="amount" />
        <small class="field-error" *ngIf="form.controls.amount.touched && form.controls.amount.errors?.['required']">
          {{ messages.required }}
        </small>
        <small class="field-error" *ngIf="form.controls.amount.touched && form.controls.amount.errors?.['min']">
          {{ messages.positiveAmount }}
        </small>
      </div>

      <div class="field">
        <label for="category">{{ labels.category }}</label>
        <select id="category" formControlName="category">
          <option value="">{{ labels.category }}</option>
          <option *ngFor="let category of categoriesForType" [value]="category._id">
            {{ category.icon }} {{ category.name }}
          </option>
        </select>
        <small class="field-error" *ngIf="form.controls.category.touched && form.controls.category.errors?.['required']">
          {{ messages.required }}
        </small>
      </div>

      <div class="form-row">
        <div class="field">
          <label for="date">{{ labels.date }}</label>
          <input id="date" type="date" formControlName="date" />
          <small class="field-error" *ngIf="form.controls.date.touched && form.controls.date.errors?.['required']">
            {{ messages.required }}
          </small>
        </div>

        <div class="field">
          <label for="paidBy">{{ labels.paidBy }}</label>
          <select id="paidBy" formControlName="paidBy">
            <option value="">{{ labels.paidBy }}</option>
            <option *ngFor="let user of users" [value]="user._id">{{ user.name }}</option>
          </select>
          <small class="field-error" *ngIf="form.controls.paidBy.touched && form.controls.paidBy.errors?.['required']">
            {{ messages.required }}
          </small>
        </div>
      </div>

      <div class="field">
        <label for="note">{{ labels.note }}</label>
        <textarea
          id="note"
          formControlName="note"
          maxlength="200"
          [placeholder]="labels.noteSearch"
        ></textarea>
        <small class="muted">{{ form.controls.note.value.length }} / 200</small>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn" [disabled]="saving">
          {{ saving ? labels.loading : labels.save }}
        </button>
        <a routerLink="/transactions" class="btn btn-secondary">{{ labels.cancel }}</a>
      </div>
    </form>
  </div>
</div>

<div class="page settings-page">
  <div class="page-header">
    <h1>{{ labels.settings }}</h1>
  </div>

  <div class="card" *ngIf="auth.user as user">
    <h3>{{ labels.profile }}</h3>
    <p><strong>{{ user.name }}</strong></p>
    <p class="muted">{{ user.email }}</p>
  </div>

  <div class="card password-card">
    <h3>{{ labels.changePassword }}</h3>
    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="field">
        <label for="current-password">{{ labels.currentPassword }}</label>
        <input id="current-password" type="password" formControlName="currentPassword" autocomplete="current-password" />
        <small class="field-error" *ngIf="form.controls.currentPassword.touched && form.controls.currentPassword.errors?.['required']">
          {{ messages.required }}
        </small>
        <small class="field-error" *ngIf="form.controls.currentPassword.touched && form.controls.currentPassword.errors?.['minlength']">
          {{ messages.minPassword }}
        </small>
      </div>

      <div class="field">
        <label for="new-password">{{ labels.newPassword }}</label>
        <input id="new-password" type="password" formControlName="newPassword" autocomplete="new-password" />
        <small class="field-error" *ngIf="form.controls.newPassword.touched && form.controls.newPassword.errors?.['required']">
          {{ messages.required }}
        </small>
        <small class="field-error" *ngIf="form.controls.newPassword.touched && form.controls.newPassword.errors?.['minlength']">
          {{ messages.minPassword }}
        </small>
      </div>

      <div class="field">
        <label for="confirm-password">{{ labels.confirmPassword }}</label>
        <input id="confirm-password" type="password" formControlName="confirmPassword" autocomplete="new-password" />
        <small class="field-error" *ngIf="form.controls.confirmPassword.touched && form.controls.confirmPassword.errors?.['required']">
          {{ messages.required }}
        </small>
        <small class="field-error" *ngIf="form.controls.confirmPassword.touched && form.errors?.['mismatch']">
          {{ messages.passwordMismatch }}
        </small>
      </div>

      <button type="submit" class="btn" [disabled]="saving">
        {{ saving ? labels.loading : labels.changePassword }}
      </button>
    </form>
  </div>

  <button type="button" class="btn btn-secondary logout-button" (click)="logout()">{{ labels.logout }}</button>
</div>
